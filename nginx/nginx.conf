server {
    listen 80;
    server_name localhost;

    # Permite adjuntar documentos (factura, BL, packing list) de tamaño
    # razonable vía multipart sin que Nginx los rechace con 413.
    client_max_body_size 20M;

    # Documentos subidos (media_volume, compartido de solo lectura con backend)
    location /media/ {
        alias /app/media/;
    }

    # API -> Django (backend)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin de Django (útil en desarrollo)
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estáticos del admin de Django
    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    # Frontend -> React (Vite dev server)
    location / {
        proxy_pass http://frontend:5173/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Requerido por Vite HMR (WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
